components:
  schemas:
    ListData:
      type: object
      properties:
        Id:
          type: string
        ListName:
          type: string
        CreatedBy:
          type: string
        CustomerId:
          format: int32
          type: integer
        AccountId:
          format: int32
          type: integer
        CompanyName:
          type: string
        FirstName:
          type: string
        LastName:
          type: string
        Notes:
          type: string
        TotalParts:
          format: int32
          type: integer
        DateCreated:
          format: date-time
          type: string
        DateLastAccessed:
          format: date-time
          type: string
        DateModified:
          format: date-time
          type: string
        Tags:
          type: array
          items:
            type: string
        ListSettings:
          $ref: '#/components/schemas/ListSettings'
        PartsList:
          type: array
          items:
            $ref: '#/components/schemas/RequestedPart'
        Revisions:
          type: array
          items:
            $ref: '#/components/schemas/Revision'
        CanEdit:
          type: boolean
        UserInformation:
          $ref: '#/components/schemas/UserInformation'
      additionalProperties: false
    Column:
      type: object
      properties:
        ColumnName:
          type: string
        IsVisible:
          type: boolean
      additionalProperties: false
    RequestedQuantity:
      type: object
      properties:
        SelectedPackType:
          type: string
        SelectedSubPackType:
          type: string
        Quantity:
          format: int32
          type: integer
        TargetPrice:
          format: double
          type: number
      additionalProperties: false
    ApiValidationError:
      description: Error with API input.
      type: object
      properties:
        Field:
          description: The field that generated the error.
          type: string
          example: Keywords
        Message:
          description: The error message that was generated. This often explains how to fix your API input to be valid.
          type: string
          example: The Keywords field is required.
      additionalProperties: false
    ListSettings:
      type: object
      properties:
        Visibility:
          enum:
          - Private
          - ReadOnly
          - ReadWrite
          type: string
        PackagePreference:
          enum:
          - CutTapeOrTR
          - DigiReelOrTR
          - EnteredPartNumber
          - StandardPack
          type: string
        ColumnPreferences:
          type: array
          items:
            $ref: '#/components/schemas/Column'
        AutoCorrectQuantities:
          type: boolean
        AttritionEnabled:
          type: boolean
        AutoPopulateCref:
          type: boolean
      additionalProperties: false
    CreateListRequest:
      description: Information need for creating a new MyList
      required:
      - ListName
      type: object
      properties:
        ListName:
          description: Gets or sets name of the new list
          minLength: 1
          type: string
        CreatedBy:
          description: Gets or sets who the list was created by (rep or customer)
          type: string
        Tags:
          description: Gets or sets assigns any tags entered to the newly created list
          type: array
          items:
            type: string
        Source:
          description: Gets or Sets Source
          enum:
          - other
          - internal
          - external
          - mobile
          - search
          - b2b
          type: string
        ListSettings:
          $ref: '#/components/schemas/ListSettings'
        RefList:
          $ref: '#/components/schemas/ReferenceList'
      additionalProperties: false
    ApiErrorResponse:
      description: Common response model returned for any type of HTTP exception.
      type: object
      properties:
        _ErrorResponseVersion:
          description: The version of the error handler.
          type: string
          readOnly: true
          example: 3.0.0.0
        StatusCode:
          format: int32
          description: The HttpStatusCode of the error.
          type: integer
          example: 404
        ErrorMessage:
          description: The message provided by the error handler.
          type: string
          example: The specified part was not found
        ErrorDetails:
          description: The details of the error.
          type: string
          example: Part Not Found
        RequestId:
          description: The Id of the request that triggered the error. If contacting API Support, please include the RequestId.
          type: string
          example: 22da819d-9517-4a2c-a8c1-0195ea2e7878
        ValidationErrors:
          description: The list of validation errors (if applicable).
          type: array
          items:
            $ref: '#/components/schemas/ApiValidationError'
      additionalProperties: false
    Revision:
      type: object
      properties:
        Id:
          type: string
        ListId:
          type: string
        RevisionNumber:
          format: int32
          type: integer
        DateCreated:
          format: date-time
          type: string
        Parts:
          type: array
          items:
            $ref: '#/components/schemas/RequestedPart'
      additionalProperties: false
    UserInformation:
      type: object
      properties:
        ContactId:
          format: int32
          type: integer
        AccountId:
          format: int32
          type: integer
      additionalProperties: false
    ReferenceList:
      type: object
      properties:
        ListId:
          type: string
        IsGuestList:
          type: boolean
        IsRevision:
          type: boolean
      additionalProperties: false
    RequestedPart:
      type: object
      properties:
        UniqueId:
          type: string
        PartId:
          format: int32
          type: integer
        RequestedPartNumber:
          type: string
        OriginalPartNumber:
          type: string
        ManufacturerName:
          type: string
        CustomerReference:
          type: string
        ReferenceDesignator:
          type: string
        Notes:
          type: string
        SelectedQuantityIndex:
          format: int32
          type: integer
        Attrition:
          format: double
          type: number
        AlternateParts:
          type: array
          items:
            type: string
        Quantities:
          type: array
          items:
            $ref: '#/components/schemas/RequestedQuantity'
      additionalProperties: false
  securitySchemes:
    apiKeySecurity:
      type: apiKey
      name: X-DIGIKEY-Client-Id
      in: header
    oauth2ApplicationSecurity:
      type: oauth2
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: https://api.digikey.com/v1/oauth2/token
