openapi: 3.2.0
info:
  title: Digi Key Pack List API
  version: v1
  contact:
    name: B2BApi Team
    url: https://developer.digikey.com/support
    email: dl_Agile_Team_B2B_API@digikey.com
  termsOfService: https://www.digikey.com/en/terms-and-conditions
  x-technical-domain: Sales
  description: 'Operations tagged PackList across 2 of this provider''s published API definitions: digi-key-packinglist-api-packinglist.json, digi-key-packinglist-api-packinglist-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.digikey.com/packinglist
security:
- apiKeySecurity: []
  oauth2AccessCodeSecurity: []
tags:
- name: PackList
paths:
  /v1/invoice/{invoiceId}:
    get:
      tags:
      - PackList
      summary: Enter an Invoice Number and receive a single packing list
      operationId: GetPackingList
      parameters:
      - in: path
        name: invoiceId
        description: Enter the Invoice ID that is to be returned.
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: includePdf
        description: If you would like to have a pdf for this packing list returned, set the value to “True”.
        schema:
          type: boolean
      - in: header
        name: X-DIGIKEY-Client-Id
        description: The Client Id for your app.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/InvoicePackingList'
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePackingList'
            text/json:
              schema:
                $ref: '#/components/schemas/InvoicePackingList'
        '400':
          description: Bad Request - The input model is invalid or malformed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '401':
          description: Unauthorized - Token is expired or Client Id or subscription are invalid.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '403':
          description: The target resource is forbidden.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '404':
          description: Not Found - The requested resource could not be found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
            application/json:
