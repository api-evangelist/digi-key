        description: The Client Id for your app.
        required: true
        schema:
          type: string
      - in: path
        name: listId
        description: Unique list id
        required: true
        schema:
          type: string
      - in: query
        name: index
        description: Index at where you can add the part to
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: OK
          content:
