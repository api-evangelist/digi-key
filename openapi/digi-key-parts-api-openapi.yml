openapi: 3.2.0
info:
  title: Digi Key Parts API
  version: v1
  contact:
    name: API Support
    url: https://developer.digikey.com/support
  termsOfService: https://www.digikey.com/en/terms-and-conditions
  description: 'Operations tagged Parts across 2 of this provider''s published API definitions: digi-key-mylists-api-mylists-v1.json, digi-key-mylists-api-mylists-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.digikey.com/mylists/v1
security:
- apiKeySecurity: []
  oauth2ApplicationSecurity: []
tags:
- name: Parts
paths:
  /lists/{listId}/parts/{uniqueId}:
    get:
      tags:
      - Parts
      summary: Gets part from a specified list by the unique id of the part
      operationId: GetPartFromListByUniqueId
      parameters:
      - in: header
        name: Authorization
        description: OAuth Bearer Token. Please see<a href= "https://developer.digikey.com/documentation/oauth" target= "_blank" > OAuth 2.0 Documentation </a > page for more info.
        schema:
          type: string
      - in: header
        name: X-DIGIKEY-Client-Id
        description: The Client Id for your app.
        required: true
        schema:
          type: string
      - in: path
        name: listId
        description: Unique list id
        required: true
        schema:
          type: string
      - in: path
        name: uniqueId
        description: A uniqueId for a part that you want pricing for
        required: true
        schema:
          type: string
      - in: query
        name: countryIso
        description: Desired country
        schema:
          type: string
          default: ''
      - in: query
        name: currencyIso
        description: Desired currency
        schema:
          type: string
          default: ''
      - in: query
        name: languageIso
        description: Desired language
        schema:
          type: string
          default: en
      - in: query
        name: pricingCountryIso
        description: Desired pricingCountry (set to countryIso by default)
        schema:
          type: string
          default: ''
      - in: query
        name: assemblies
        description: Number that the quantity should be multiplied by for pricing information
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: createdBy
        description: Used if a customerId is not passed in
        schema:
          type: string
          default: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPart'
        '400':
          description: Bad Request - The input model is invalid or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized - Token is expired or Client Id or subscription are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: The target resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found - The requested resource could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Too Many Requests - Your rate limit has been exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: An unhandled error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Service Unavailable - The service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    put:
      tags:
      - Parts
      summary: Updates all part information for the specified part unique id
      operationId: UpdatePartFromListByUniqueId
      parameters:
      - in: header
        name: Authorization
        description: OAuth Bearer Token. Please see<a href= "https://developer.digikey.com/documentation/oauth" target= "_blank" > OAuth 2.0 Documentation </a > page for more info.
        schema:
