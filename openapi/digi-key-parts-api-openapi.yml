components:
  schemas:
    ListPart:
      type: object
      properties:
        PartId:
          format: int32
          type: integer
        UniqueId:
          type: string
        CustomerReference:
          type: string
        ReferenceDesignator:
          type: string
        Notes:
          type: string
        MinOrderQty:
          format: int32
          type: integer
        MaxOrderQty:
          format: int64
          type: integer
        OriginalPartNumber:
          type: string
        RequestedPartNumber:
          type: string
        DigiKeyPartNumber:
          type: string
        ManufacturerPartNumber:
          type: string
        RequestedManufacturerName:
          type: string
        Manufacturer:
          type: string
        Description:
          type: string
        PartStatus:
          type: string
        PartStatusCode:
          format: int32
          enum:
          - Active
          - Obsolete
          - Discontinued
          - ComingSoon
          - LastTimeBuy
          - NotForNewDesigns
          type: integer
        Availability:
          type: string
        TariffCode:
          format: int32
          enum:
          - NoTariff
          - TariffPending
          - TariffApplied
          type: integer
        QuantityAvailable:
          format: int32
          type: integer
        SelectedQuantityIndex:
          format: int32
          type: integer
        Attrition:
          format: double
          type: number
        Quantities:
          type: array
          items:
            $ref: '#/components/schemas/ListPartQuantity'
        VendorLeadWeeks:
          format: int32
          type: integer
        PartDetailUrl:
          type: string
        PrimaryDatasheetUrl:
          type: string
        ImageUrl:
          type: string
        ThumbnailUrl:
          type: string
        MarketPlaceSupplierLink:
          type: string
        SupplierName:
          type: string
        Substitutes:
          type: array
          items:
            $ref: '#/components/schemas/PartOption'
        AlternateParts:
          type: array
          items:
            $ref: '#/components/schemas/PartOption'
        Flags:
          $ref: '#/components/schemas/ListPartFlags'
        ReachStatus:
          type: string
        RohsStatusMessage:
          type: string
        Eccn:
          type: string
        Htsus:
          type: string
        CountryOfOrigin:
          type: string
        EnvironmentalDocs:
          type: object
          additionalProperties:
            type: string
        Category:
          type: string
        PartsAvailableForCref:
          type: array
          items:
            $ref: '#/components/schemas/CrefPartOption'
        CrefsAvailableForPart:
          type: array
          items:
            type: string
      additionalProperties: false
    PackOptionWithPricing:
      type: object
      properties:
        PartId:
          format: int32
          type: integer
        DigiKeyPartNumber:
          type: string
        ManufacturerPartNumber:
          type: string
        Quantity:
          format: int32
          type: integer
        PackType:
          type: string
        QuantityAvailable:
          format: int32
          type: integer
        MinimumOrderQuantity:
          format: int32
          type: integer
        CalculatedUnitPrice:
          format: double
          type: number
        ExtendedPrice:
          format: double
          type: number
        BreakPrice:
          format: double
          type: number
        BreakQuantity:
          format: int32
          type: integer
        IsUpsell:
          type: boolean
        ValueAdditionalFee:
          format: double
          type: number
        SubPackOptions:
          type: array
          items:
            $ref: '#/components/schemas/PackOptionWithPricing'
        FormattedUnitPrice:
          type: string
        FormattedExtendedPrice:
          type: string
      additionalProperties: false
    RequestedQuantity:
      type: object
      properties:
        SelectedPackType:
          type: string
        SelectedSubPackType:
          type: string
        Quantity:
          format: int32
          type: integer
        TargetPrice:
          format: double
          type: number
      additionalProperties: false
    PartOption:
      type: object
      properties:
        PartId:
          format: int32
          type: integer
        DigiKeyPartNumber:
          type: string
        Manufacturer:
          type: string
        ManufacturerPartNumber:
          type: string
        Description:
          type: string
        PartDetailUrl:
          type: string
        SubstituteType:
          type: string
        MinimumOrderQuantity:
          format: int32
          type: integer
        QuantityAvailable:
          type: string
        TariffStatus:
          format: int32
          enum:
          - NoTariff
          - TariffPending
          - TariffApplied
          type: integer
        MasterPartId:
          format: int32
          type: integer
        UnitPrice:
          type: string
      additionalProperties: false
    ApiErrorResponse:
      description: Common response model returned for any type of HTTP exception.
      type: object
      properties:
        _ErrorResponseVersion:
          description: The version of the error handler.
          type: string
          readOnly: true
          example: 3.0.0.0
        StatusCode:
          format: int32
          description: The HttpStatusCode of the error.
          type: integer
          example: 404
        ErrorMessage:
          description: The message provided by the error handler.
          type: string
          example: The specified part was not found
        ErrorDetails:
          description: The details of the error.
          type: string
          example: Part Not Found
        RequestId:
          description: The Id of the request that triggered the error. If contacting API Support, please include the RequestId.
          type: string
          example: 22da819d-9517-4a2c-a8c1-0195ea2e7878
        ValidationErrors:
          description: The list of validation errors (if applicable).
          type: array
          items:
            $ref: '#/components/schemas/ApiValidationError'
      additionalProperties: false
    CrefPartOption:
      type: object
      properties:
        ManufacturerPartnumber:
          type: string
        Manufacturer:
          type: string
        MinimumOrderQuantity:
          format: int32
          type: integer
        Description:
          type: string
        QuantityAvailable:
          format: int32
          type: integer
      additionalProperties: false
    RequestedPart:
      type: object
      properties:
        UniqueId:
          type: string
        PartId:
          format: int32
          type: integer
        RequestedPartNumber:
          type: string
        OriginalPartNumber:
          type: string
        ManufacturerName:
          type: string
        CustomerReference:
          type: string
        ReferenceDesignator:
          type: string
        Notes:
          type: string
        SelectedQuantityIndex:
          format: int32
          type: integer
        Attrition:
          format: double
          type: number
        AlternateParts:
          type: array
          items:
            type: string
        Quantities:
          type: array
          items:
            $ref: '#/components/schemas/RequestedQuantity'
      additionalProperties: false
    PartsByListIdResponse:
      type: object
      properties:
        PartsList:
          type: array
          items:
            $ref: '#/components/schemas/ListPart'
        TotalParts:
          format: int32
          type: integer
      additionalProperties: false
    ApiValidationError:
      description: Error with API input.
      type: object
      properties:
        Field:
          description: The field that generated the error.
          type: string
          example: Keywords
        Message:
          description: The error message that was generated. This often explains how to fix your API input to be valid.
          type: string
          example: The Keywords field is required.
      additionalProperties: false
    ListPartQuantity:
      type: object
      properties:
        QuantityRequested:
          format: int32
          type: integer
        CalculatedQuantity:
          format: int32
          type: integer
        TargetPrice:
          format: double
          type: number
        SelectedPackType:
          type: string
        SelectedSubPackType:
          type: string
        IsInactive:
          type: boolean
        SelectedPackOptionIndex:
          format: int32
          type: integer
        SelectedSubPackOptionIndex:
          format: int32
          type: integer
        PackOptions:
          type: array
          items:
            $ref: '#/components/schemas/PackOptionWithPricing'
      additionalProperties: false
    ListPartFlags:
      type: object
      properties:
        NonStock:
          type: boolean
        IsNCNR:
          type: boolean
        IsSDS:
          type: boolean
        IsValueAdd:
          type: boolean
        IsMatched:
          type: boolean
        IsMarketPlace:
          type: boolean
        BoNotAllowed:
          type: boolean
        DisplayRegularLeadTime:
          type: boolean
        DisplayCheckActiveLeadTime:
          type: boolean
        MultipleCrefsForPart:
          type: boolean
        MultiplePartsForCref:
          type: boolean
        IsChecked:
          type: boolean
        IsEditable:
          type: boolean
        IsDeniedByCountry:
          type: boolean
        IsDeniedByCurrency:
          type: boolean
        IsDeniedByCustomerId:
          type: boolean
      additionalProperties: false
  securitySchemes:
    apiKeySecurity:
      type: apiKey
      name: X-DIGIKEY-Client-Id
      in: header
    oauth2ApplicationSecurity:
      type: oauth2
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: https://api.digikey.com/v1/oauth2/token
