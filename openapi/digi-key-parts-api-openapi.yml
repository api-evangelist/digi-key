          type: string
      - in: path
        name: uniqueId
        description: The uniqueId of the part that should be updated in the database
        required: true
        schema:
          type: string
      - in: query
        name: createdBy
        description: Used if a customerId is not passed in
        schema:
          type: string
          default: ''
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request - The input model is invalid or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized - Token is expired or Client Id or subscription are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: The target resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found - The requested resource could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Too Many Requests - Your rate limit has been exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: An unhandled error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Service Unavailable - The service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/RequestedPart'
          application/json:
            schema:
              $ref: '#/components/schemas/RequestedPart'
          text/json:
            schema:
              $ref: '#/components/schemas/RequestedPart'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RequestedPart'
        description: The part to be updated
    delete:
      tags:
      - Parts
      summary: Deletes the specified part
      operationId: DeletePartFromListByUniqueId
      parameters:
      - in: header
        name: Authorization
        description: OAuth Bearer Token. Please see<a href= "https://developer.digikey.com/documentation/oauth" target= "_blank" > OAuth 2.0 Documentation </a > page for more info.
        schema:
          type: string
      - in: header
        name: X-DIGIKEY-Client-Id
        description: The Client Id for your app.
        required: true
        schema:
          type: string
      - in: path
        name: listId
        description: Unique list id
        required: true
        schema:
          type: string
      - in: path
        name: uniqueId
        description: Unique Id for part to be deleted
        required: true
        schema:
          type: string
      - in: query
        name: createdBy
        description: Used if a customerId is not passed in
        schema:
          type: string
          default: ''
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request - The input model is invalid or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized - Token is expired or Client Id or subscription are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: The target resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found - The requested resource could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Too Many Requests - Your rate limit has been exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: An unhandled error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Service Unavailable - The service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    servers:
    - url: https://api.digikey.com/mylists/v1
  /lists/{listId}/parts:
    get:
      tags:
      - Parts
      summary: Gets all parts from the list.
      operationId: GetPartsByListId
      parameters:
      - in: header
        name: Authorization
        description: OAuth Bearer Token. Please see<a href= "https://developer.digikey.com/documentation/oauth" target= "_blank" > OAuth 2.0 Documentation </a > page for more info.
        schema:
          type: string
      - in: header
        name: X-DIGIKEY-Client-Id
        description: The Client Id for your app.
        required: true
        schema:
          type: string
      - in: path
        name: listId
        description: The id of the list that you want information for
        required: true
        schema:
          type: string
      - in: query
        name: countryIso
        description: Desired country
        schema:
          type: string
          default: ''
      - in: query
        name: currencyIso
        description: Desired currency
        schema:
          type: string
          default: ''
      - in: query
        name: languageIso
        description: Desired language
        schema:
          type: string
          default: ''
      - in: query
        name: startIndex
        description: Where in the list you would like to start at
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: limit
        description: How many parts you would like returned back
        schema:
          type: integer
          format: int32
          default: 100
      - in: query
        name: assemblies
        description: The amount of units you want for every part entered. Cannot be less than 1
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: includeAttrition
        description: 'The listSetting in the database will be used if the value is false. If true it will

          include attrition'
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
