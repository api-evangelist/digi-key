  /search/packagetypebyquantity/{productNumber}:
    get:
      tags:
      - Product Search
      summary: Deprecated – please use PricingByQuantity endpoint to receive pricing for all…
      operationId: PackageTypeByQuantity
      parameters:
      - in: path
        name: productNumber
        description: 'A product number. Can be either Digi-Key or Manufacturer, but some manufacturer product

          numbers are ambiguous and will not be found. A DKR product number will override a CT packagingPreference.'
        required: true
        schema:
          type: string
      - in: query
        name: requestedQuantity
        description: 'The quantity of the product that you are interested in. This will be used to determine

          the quantity to purchase in standard tape and reel, and also in your product preference for the remainder.'
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: packagingPreference
        description: 'Can be either "CT" for Cut Tape or "DKR" for Digi-Reel. This will select what package

