openapi: 3.2.0
info:
  title: Digi Key Product Search API
  version: v4
  contact:
    name: B2BApi Team
    url: https://developer.digikey.com/support
    email: dl_Agile_Team_B2B_API@digikey.com
  termsOfService: https://www.digikey.com/en/terms-and-conditions
  x-technical-domain: Sales
  description: 'Operations tagged ProductSearch across 2 of this provider''s published API definitions: digi-key-productsearch-api-products-v4.json, digi-key-productsearch-api-products-v4-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.digikey.com/products/v4
security:
- apiKeySecurity: []
  oauth2ApplicationSecurity: []
tags:
- name: Product Search
paths:
  /search/keyword:
    post:
      tags:
      - Product Search
      summary: Enter parameters, keywords, or a manufacturer part number/DigiKey part number…
      description: 'Search for product information based on part number, description, manufacturer, or category. This new API supports two-legged and three-legged OAuth authentication.

        [all endpoints for https://developer.digikey.com/products/product-information-v4/productsearch]


        MyPricing is not available in the KeywordSearch response, and only StandardPricing is returned.

        Please use the ProductDetails or ProductPricing endpoints to receive MyPricing'
      operationId: KeywordSearch
      parameters:
      - in: query
        name: includes
        description: ''
        schema:
          type: string
      - in: header
        name: X-DIGIKEY-Client-Id
        description: The Client Id for your app.
        required: true
        schema:
          type: string
      - in: header
        name: X-DIGIKEY-Locale-Language
        description: 'Two letter code for language to search on. Language must be supported by the selected site. If searching on keyword, this language is used to find matches. Acceptable values include: en, ja, de, fr, ko, zhs, zht, it, es, he, nl, sv, pl, fi, da, no.

          Default value: en'
        schema:
          type: string
      - in: header
        name: X-DIGIKEY-Locale-Currency
        description: 'Three letter code for Currency to return part pricing for. Currency must be supported by the selected site. Acceptable values include: USD, CAD, JPY, GBP, EUR, HKD, SGD, TWD, KRW, AUD, NZD, INR, DKK, NOK, SEK, ILS, CNY, PLN, CHF, CZK, HUF, RON, ZAR, MYR, THB, PHP.

          Default value: primary currency for the entered Locale-site.'
        schema:
          type: string
      - in: header
        name: X-DIGIKEY-Locale-Site
        description: 'Two letter code for Digi-Key product website to search on. Different countries'' sites have different part restrictions, supported languages, and currencies. Acceptable values include: US, CA, JP, UK, DE, AT, BE, DK, FI, GR, IE, IT, LU, NL, NO, PT, ES, KR, HK, SG, CN, TW, AU, FR, IN, NZ, SE, MX, CH, IL, PL, SK, SI, LV, LT, EE, CZ, HU, BG, MY, ZA, RO, TH, PH, BR, VN.

          Default value: US'
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeywordResponse'
        '400':
          description: Bad Request - The input model is invalid or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '401':
          description: Unauthorized - Token is expired or Client Id or subscription are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '403':
          description: The target resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '404':
          description: Not Found - The requested resource could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '429':
          description: Too Many Requests - Your rate limit has been exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '500':
          description: An unhandled error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '503':
          description: Service Unavailable - The service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeywordRequest'
    servers:
    - url: https://api.digikey.com/products/v4
  /search/{productNumber}/pricing:
    get:
      tags:
      - Product Search
      summary: Enter a manufacturer part number/DigiKey part number or partial manufacturer…
      description: Allows you to use inStock and excludeMarketplace as limit. If there are multiple matching parts, you can see the additional ones by incrementing your input using the offset and limit fields. Locale information is required in the headers for accurate pricing and currencies. Locale and currencies will be set to default values if not populated or populated with invalid values. Check the “Settings Used” fields to see which values we used for the response.
      operationId: ProductPricing
      parameters:
      - in: path
        name: productNumber
        description: "ProductNumber to search on. Can be partial part number, manufacturer part number, or a Digi-Key part number.\tEnter the ProductNumber to be searched. You can enter a manufacturer part number or a DigiKey part number. You can enter a partial or complete product number. The search results are better when entering a DigiKey product number, as some manufacturers share the same manufacturer part number."
        required: true
        schema:
          type: string
      - in: query
        name: limit
        description: 'Enter the maximum number of products to be returned. The maximum amount is 10. Default value: 5'
        schema:
          type: integer
          format: int32
          default: 5
      - in: query
        name: offset
        description: 'Enter the starting index for the records to be returned. This is used when making subsequent calls for the same ProductNumber. Default value: 0'
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: inStock
        description: 'Enter true to exclude products that are not in stock. Default value : false'
        schema:
          type: boolean
          default: false
      - in: query
        name: excludeMarketplace
        description: 'Enter true to exclude Marketplace items and limit results to those fulfilled by DigiKey. Default value: false'
        schema:
          type: boolean
          default: false
      - in: query
        name: excludeTariff
        schema:
          type: boolean
          default: false
      - in: header
        name: X-DIGIKEY-Account-Id
        description: 'Your DigiKey AccountID. This optional field should be populated when your email address is associated with more than one Account and you are using 3-legged OAuth. If you are using 2-Legged OAuth, it is a required field to receive a successful response.


          We use the AccountID to determine if MyPricing, if available, will be returned and which region’s pricing agreement will be used.


          Select ‘My account’ above to learn more about AccountIDs.'
        schema:
          type: string
      - in: header
        name: X-DIGIKEY-Locale-Site
        description: 'This value determines which country’s prices are used for StandardPricing and MyPricing. Also, product restrictions can differ by country. Acceptable values include: AT, AU, BE, BG, BR, CA, CH, CN, CZ, DE, DK, EE, ES, FI, FR, GR, HK, HU, IE, IL, IN, IT, JP, KR, LT, LU, LV, MX, MY, NL, NO, NZ, PH, PL, PT, RO, SE, SG, SI, SK, TH, TW, UK, US, ZA

          Default value: US'
        schema:
          type: string
      - in: header
        name: X-DIGIKEY-Locale-Language
        description: 'This value determines which language is used for the links in reply. If the entered language is not valid for the entered Locale-Site, it will default to English. Acceptable values include: CS, DA, DE, EN, ES, FI, FR, HE, HU, IT, JA, KO, NL, NO, PL, PT, RO, SV, TH, ZHS, ZHT

          Default value: English'
        schema:
          type: string
      - in: header
        name: X-DIGIKEY-Locale-Currency
        description: 'This value determines which country’s prices are used for StandardPricing and MyPricing. If the value is not allowed for the entered Locale-Site, it defaults to the primary currency for that Locale-Site. Ex: If Locale-Currency = EUR and Locale-Site = US, then the system will default to USD and note that in the response. Acceptable values include: AUD, CAD, CHF, CNY, CZK, DKK, EUR, GBP, HKD, HUF, ILS, INR, JPY, KRW, MYR, NOK, NZD, PHP, PLN, RON, SEK, SGD, THB, TWD, USD, ZAR

          Default value: primary currency for the entered Locale-site.'
        schema:
          type: string
      - in: header
        name: X-DIGIKEY-Client-Id
        description: The Client Id for your App. Enter the ClientID for the Product App used to make the call.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPricingResponse'
        '400':
          description: Bad Request - The input model is invalid or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '401':
          description: Unauthorized - Token is expired or Client Id or subscription are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '403':
          description: The target resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '404':
          description: Not Found - The requested resource could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '429':
          description: Too Many Requests - Your rate limit has been exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '500':
          description: An unhandled error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '503':
          description: Service Unavailable - The service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
    servers:
    - url: https://api.digikey.com/products/v4
