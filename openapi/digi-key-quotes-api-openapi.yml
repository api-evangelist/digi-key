openapi: 3.2.0
info:
  title: Digi Key Quotes API
  version: v4
  contact:
    name: API Support
    url: https://developer.digikey.com/support
  termsOfService: https://www.digikey.com/en/terms-and-conditions
  description: 'Operations tagged Quotes across 2 of this provider''s published API definitions: digi-key-quote-api-quoting-v4.json, digi-key-quote-api-quoting-v4-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.digikey.com/quoting/v4
security:
- apiKeySecurity: []
  oauth2AccessCodeSecurity: []
tags:
- name: Quotes
paths:
  /quotes:
    post:
      tags:
      - Quotes
      summary: Create a quote. Products are added to it in the AddProductsToQuote operation
      operationId: CreateQuote
      parameters:
      - in: header
        name: Authorization
        description: OAuth Bearer Token. Please see<a href= "https://developer.digikey.com/documentation/oauth" target= "_blank" > OAuth 2.0 Documentation </a > page for more info.
        required: true
        schema:
          type: string
      - in: header
        name: X-DIGIKEY-Client-Id
        description: The Client Id for your app.
        required: true
        schema:
          type: string
      - in: header
        name: X-DIGIKEY-Locale-Currency
        description: 'This value determines which country’s prices are used to create the quote. Acceptable values include: AUD, CAD, CHF, CNY, CZK, DKK, EUR, GBP, HKD, HUF, ILS, INR, JPY, KRW, MYR, NOK, NZD, PHP, PLN, RON, SEK, SGD, THB, TWD, USD, ZAR.

          Default value: primary currency for the entered CustomerId’s mailing address.'
        schema:
          type: string
      - in: header
        name: X-DIGIKEY-Locale-Site
        description: 'Two letter code for Digi-Key product website to search on. Different countries'' sites have different part restrictions, supported languages, and currencies. Acceptable values include: US, CA, JP, UK, DE, AT, BE, DK, FI, GR, IE, IT, LU, NL, NO, PT, ES, KR, HK, SG, CN, TW, AU, FR, IN, NZ, SE, MX, CH, IL, PL, SK, SI, LV, LT, EE, CZ, HU, BG, MY, ZA, RO, TH, PH, BR, VN.

          Default value: US'
        schema:
          type: string
      - in: header
        name: X-DIGIKEY-Account-Id
        description: "This optional field should be populated when your email address is associated with more than one Account. \nWe use the AccountID to determine which quotes will be returned.\nSelect ‘My account’ above to learn more about AccountIDs.\n"
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          description: Bad Request - The input model is invalid or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '401':
          description: Unauthorized - Token is expired or Client Id or subscription are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '403':
          description: The target resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '404':
          description: Not Found - The requested resource could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '429':
          description: Too Many Requests - Your rate limit has been exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '500':
          description: An unhandled error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '503':
          description: Service Unavailable - The service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
        description: Information to needed to create a new list
    get:
      tags:
      - Quotes
      summary: Retrieve quote information (excluding the product information) for a range of…
      operationId: AllQuotes
      parameters:
      - in: query
        name: offset
        description: starting index of quotes to retrieve. This is used to paginate beyond offset returned. Default is “0”
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: limit
        description: Maximum number of results returned. Defaults to 10 but must be 50 or less.
        schema:
          type: integer
          format: int32
          default: 10
      - in: header
        name: Authorization
        description: OAuth Bearer Token. Please see<a href= "https://developer.digikey.com/documentation/oauth" target= "_blank" > OAuth 2.0 Documentation </a > page for more info.
        required: true
        schema:
          type: string
      - in: header
        name: X-DIGIKEY-Client-Id
        description: The Client Id for your app.
        required: true
        schema:
          type: string
      - in: header
        name: X-DIGIKEY-Account-Id
        description: "This optional field should be populated when your email address is associated with more than one Account. \nWe use the AccountID to determine which quotes will be returned.\nSelect ‘My account’ above to learn more about AccountIDs.\n"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotesResponse'
        '400':
          description: Bad Request - The input model is invalid or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '401':
          description: Unauthorized - Token is expired or Client Id or subscription are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '403':
          description: The target resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '404':
          description: Not Found - The requested resource could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '429':
          description: Too Many Requests - Your rate limit has been exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '500':
          description: An unhandled error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
        '503':
          description: Service Unavailable - The service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
