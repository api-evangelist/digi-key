components:
  schemas:
    QuoteInformation:
      description: Response for creating a quote
      type: object
      properties:
        TotalProducts:
          format: int32
          description: The total number of products on a quote, not just what may be returned.
          type: integer
        QuoteId:
          format: int64
          description: The unique ID which identifies this quote.
          type: integer
        CustomerId:
          format: int32
          description: CustomerId that is on the quote
          type: integer
        DateCreated:
          format: date-time
          description: Date the quote was created
          type: string
        ExpirationStatus:
          $ref: '#/components/schemas/ExpirationStatus'
        Currency:
          description: '   The currency used for the quote. Note this may be different from the value you entered if that value

            was not one of our allowed values or not valid the for the CustomerId’s country.'
          type: string
        QuoteName:
          description: The name the user gave to the quote when it was created.
          type: string
      additionalProperties: false
    QuoteProductQuantity:
      description: Contains all quantity information
      type: object
      properties:
        Quantity:
          format: int32
          description: Quoted Quantity
          type: integer
        UnitPrice:
          format: double
          description: Quoted Unit Price
          type: number
        ExtendedPrice:
          format: double
          description: Quoted Extended Price
          type: number
      additionalProperties: false
    RoHSStatusCode:
      enum:
      - Unknown
      - Compliant
      - Mix
      - NonCompliant
      - ByException
      - NotApplicable
      - VendorUndefined
      - Compliant3
      type: string
    ReachStatusCode:
      enum:
      - Unknown
      - Affected
      - Unaffected
      - NotApplicable
      type: string
    ExpirationStatus:
      enum:
      - Active
      - Error
      - Expired
      type: string
    CreateQuoteRequest:
      description: Create request parameters
      required:
      - QuoteName
      type: object
      properties:
        QuoteName:
          description: The name you want to give for your quote. Maximum length is 40 characters.
          type: string
      additionalProperties: false
    AddProductToQuote:
      description: Add Product information to a quote
      type: object
      properties:
        ProductNumber:
          description: Product number to add to the quote. Only Manufacturer Part Numbers and DigiKey Part Numbers are accepted.
          type: string
        CustomerReference:
          description: The Customer Reference for the product. Maximum is 40 characters.
          type: string
        Quantities:
          description: Quantity of the product to add to the quote.
          type: array
          items:
            format: int32
            type: integer
      additionalProperties: false
    QuotesResponse:
      description: Response from querying quotes
      type: object
      properties:
        TotalQuotes:
          format: int32
          description: Total number of quotes for customerId, not the total number returned for this call
          type: integer
        Quotes:
          description: List of quote information
          type: array
          items:
            $ref: '#/components/schemas/QuoteInformation'
      additionalProperties: false
    QuoteResponse:
      description: Quote Information to a quote
      type: object
      properties:
        Quote:
          $ref: '#/components/schemas/QuoteInformation'
      additionalProperties: false
    DKProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          format: int32
          type: integer
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          readOnly: true
      additionalProperties: false
    AddProductsToQuoteResponse:
      description: Response model when adding details to a quote via API.
      type: object
      properties:
        QuoteId:
          format: int32
          description: The unique Id which identifies this quote.
          type: integer
        Errors:
          description: 'Errors will contain issues with specific details and will indicate that the detail will likely be incorrect or not

            added.'
          type: array
          items:
            type: string
        Comments:
          description: 'Comments will contain warnings or comments about specific details that you may want to take note of but should not

            prevent the detail from being added.'
          type: array
          items:
            type: string
      additionalProperties: false
    ProductsFromQuoteResponse:
      description: A range of Products from a quote
      type: object
      properties:
        TotalProducts:
          format: int32
          description: Total number of products in the quote, may be greater than the number of products returned in this response due to page limits.
          type: integer
        QuoteProducts:
          description: A range of products from a quote
          type: array
          items:
            $ref: '#/components/schemas/QuoteProduct'
      additionalProperties: false
    QuoteProduct:
      description: Extends the quote detail class with more information
      type: object
      properties:
        DetailId:
          format: int32
          description: Unique Identifier for a product.
          type: integer
        DigikeyProductNumber:
          description: Digikey product number
          type: string
        RequestedProductNumber:
          description: Product number that was requested by the customer
          type: string
        ManufacturerProductNumber:
          description: ManufacturerProductNumber
          type: string
        ManufacturerName:
          description: Manufacturer name
          type: string
        Description:
          description: Description of the product
          type: string
        CustomerReference:
          description: The CustomerReference that was entered by the customer.
          type: string
        CountryOfOrigin:
          description: Country of Origin
          type: string
        PackageType:
          description: 'Type of packaging for the product. Not all products are available in all packaging types. Possibilities include but

            are not limited to: Tape and Reel(TR), Cut Tape(CT), Digi-Reel, Tube, Tray, and Bulk.'
          type: string
        MinimumOrderQuantity:
          format: int32
          description: Minimum Order Quantity
          type: integer
        QuantityAvailable:
          format: int32
          description: In-stock quantity that is available for immediate shipping.
          type: integer
        IsObsolete:
          description: Product is obsolete
          type: boolean
        IsDiscontinued:
          description: This product is no longer sold at DigiKey and will no longer be restocked.
          type: boolean
        IsMfgQuoteRequired:
          description: Product requires a quote from the manufacturer.
          type: boolean
        IsMarketplace:
          description: Product is a Marketplace product that ships direct from the supplier. A separate shipping fee may apply
          type: boolean
        RoHSStatus:
          $ref: '#/components/schemas/RoHSStatusCode'
        ReachStatus:
          $ref: '#/components/schemas/ReachStatusCode'
        StandardPackage:
          format: int32
          description: Quantity of the standard package for the part
          type: integer
        ExpirationDate:
          format: date-time
          description: Date that the product expires on this quote
          type: string
        IsTariffActive:
          description: True if a tariff is applied
          type: boolean
        Quantities:
          description: List of quantities with unit and extended prices on it
          type: array
          items:
            $ref: '#/components/schemas/QuoteProductQuantity'
      additionalProperties: false
  securitySchemes:
    apiKeySecurityScheme:
      type: apiKey
      name: X-DIGIKEY-Client-Id
      in: header
      description: Client Id for current application
    oauth2SecurityScheme:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            Audience: developer.digikey.com HTTP Api
          authorizationUrl: https://api.digikey.com/v1/oauth2/authorize
          tokenUrl: https://api.digikey.com/v1/oauth2/token
