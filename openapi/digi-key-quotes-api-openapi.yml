        '503':
          description: Service Unavailable - The service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKProblemDetails'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AddProductToQuote'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AddProductToQuote'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AddProductToQuote'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AddProductToQuote'
        description: The products to add to the quote
    get:
      tags:
      - Quotes
      summary: Retrieve product contents for a single QuoteId created by the authenticated…
      operationId: ProductsFromQuote
      parameters:
      - in: path
        name: quoteId
        description: Unique identifier for the quote
